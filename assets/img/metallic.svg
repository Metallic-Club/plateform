<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Metallic">
  <title>Metallic</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3f3a58"/>
      <stop offset="0.55" stop-color="#2b2740"/>
      <stop offset="1" stop-color="#201d31"/>
    </linearGradient>
    <linearGradient id="head" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9a86bf"/>
      <stop offset="0.5" stop-color="#7a6797"/>
      <stop offset="1" stop-color="#544a70"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#c3bfcd"/>
      <stop offset="0.55" stop-color="#9893a5"/>
      <stop offset="1" stop-color="#726d80"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#e6bff1"/>
      <stop offset="0.6" stop-color="#c295d9"/>
      <stop offset="1" stop-color="#9a6fb8"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- head and neck -->
  <path d="M104 236c-4-26 4-47 12-64 9-19 10-40 24-54 16-16 40-18 56-6 18 13 24 38 20 64-4 24-12 42-14 60z" fill="url(#head)"/>
  <path d="M104 236c-2-24 4-44 12-60 8-17 9-36 22-50 6-7 13-11 21-13-9 8-15 18-18 30-4 17-10 31-10 47 0 15 2 31 0 46z" fill="#ffffff" opacity="0.05"/>

  <!-- crest -->
  <path d="M118 70c14-14 34-20 52-14 17 5 30 18 36 34-10-9-22-15-35-16-18-2-34 1-49 7-3 1-6-8-4-11z" fill="url(#crest)" opacity="0.95"/>
  <path d="M120 78c14-9 30-13 45-10 14 3 26 11 33 22-9-6-19-10-30-11-16-2-31 1-45 6-3 1-5-5-3-7z" fill="#f0d4f8" opacity="0.35"/>

  <!-- mouth shadow and beak -->
  <path d="M54 128c14-6 30-6 44-1-8 6-16 12-22 20-9-3-17-9-22-19z" fill="#2a1b25" opacity="0.75"/>
  <path d="M120 104 42 124c-5 1-6 7-1 9l79 26c6 2 12-1 14-6l4-11c3-7 0-14-6-17z" fill="url(#beak)"/>
  <path d="M44 126c26 6 54 15 80 23" fill="none" stroke="#6d687b" stroke-width="2" opacity="0.5"/>
  <path d="M124 152c4 1 7 4 7 8 0 3-2 6-5 8l-38 14c-7 2-13-2-13-9 0-5 3-9 8-10z" fill="#a29db0"/>
  <path d="M78 168c12 2 25 1 37-3-2 5-6 8-11 9l-24 5c-3 1-5-1-5-4 0-3 1-5 3-7z" fill="#3a2430"/>
  <path d="M96 160c8 2 16 2 24 0-3 4-8 6-13 6-5 0-9-2-11-6z" fill="#6b3a48"/>

  <!-- eye -->
  <circle cx="171" cy="108" r="15" fill="#0b0a12"/>
  <circle cx="166" cy="102" r="5" fill="#ffffff" opacity="0.92"/>
  <circle cx="177" cy="115" r="2.4" fill="#ffffff" opacity="0.25"/>
</svg>
