[package]
name = "metallic-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Metallic platform backend: one binary with roles (api now; worker, realtime, matchmaker later)."
license = "LicenseRef-Metallic-Proprietary"
publish = false
build = "build.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
yaml-rust2 = "0.13"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
yaml-rust2 = "0.13"

[profile.dev]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
