[package]
name = "metallic-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Metallic platform backend: one binary with roles (api now; worker, realtime, matchmaker later)."
license = "LicenseRef-Metallic-Proprietary"
publish = false
build = "build.rs"

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23"
ed25519-dalek = "3"
hmac = "0.13"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "derive", "time", "json", "tls-rustls-ring-native-roots"] }
subtle = "2.6"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
yaml-rust2 = "0.13"

[dev-dependencies]
http-body-util = "0.1"
jsonschema = { version = "0.60", default-features = false }
yaml-rust2 = "0.13"

[[test]]
name = "api"
path = "tests/api/main.rs"

[profile.dev]
# Disk on the dev PC is tight; line tables are enough for backtraces.
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
