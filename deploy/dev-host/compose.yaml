x-api: &api
  image: "${METALLIC_PROJECT:?Run host.py}-api:dev"
  platform: linux/amd64
  build:
    context: ../..
    dockerfile: deploy/dev-host/Dockerfile
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: "2.0"
  mem_limit: 2g
  memswap_limit: 2g
  pids_limit: 256
  stop_signal: SIGINT
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  labels:
    org.metallic.purpose: private-development-only
    org.metallic.auth-providers: dev-mailer-and-dev-captcha
  environment:
    METALLIC_ENV: dev
    METALLIC_ROLE: api
    METALLIC_BIND_ADDR: 0.0.0.0:8080
    METALLIC_DATABASE_MAX_CONNECTIONS: "10"
    METALLIC_MIGRATE_ON_START: "false"
    METALLIC_RUN_JOBS: "true"
    METALLIC_WORKER_ID: "0"
    METALLIC_PUBLIC_WEB_URL: http://localhost:3000
    METALLIC_COOKIE_SECURE: "false"
    METALLIC_DEV_MAIL_DIR: ""
    METALLIC_LOG: info
  secrets: [db_password, hmac_key, data_key, server_secret]
  depends_on:
    db: {condition: service_healthy}

services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    platform: linux/amd64
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    shm_size: 128m
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [pg_admin_password, db_password]
    volumes:
      # PostgreSQL 18 uses PGDATA=/var/lib/postgresql/18/docker, not the pre18 data mount.
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: "${METALLIC_STATE_DIR:?Run host.py}/init.sql"
        target: /docker-entrypoint-initdb.d/10-metallic.sql
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  api:
    <<: *api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${METALLIC_DEV_PORT:-18080}:8080"
  migrate:
    <<: *api
    profiles: [tools]
    restart: "no"
    command: [migrate]
    environment:
      METALLIC_ENV: dev
      METALLIC_MIGRATE_ON_START: "false"
      METALLIC_RUN_JOBS: "false"

volumes:
  postgres_data:

secrets:
  db_password:
    file: "${METALLIC_STATE_DIR:?Run host.py}/secrets/db_password"
  pg_admin_password:
    file: "${METALLIC_STATE_DIR:?Run host.py}/secrets/pg_admin_password"
  hmac_key:
    file: "${METALLIC_STATE_DIR:?Run host.py}/secrets/hmac_key"
  data_key:
    file: "${METALLIC_STATE_DIR:?Run host.py}/secrets/data_key"
  server_secret:
    file: "${METALLIC_STATE_DIR:?Run host.py}/secrets/server_secret"
