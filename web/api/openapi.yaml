              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Presence' }
              example:
                items:
                  - { userId: '1050000000000002', status: in_game, game: { id: '2050000000000010', name: Parkour }, joinable: true, lastOnlineAt: null }
                  - { userId: '1050000000000003', status: offline, game: null, joinable: false, lastOnlineAt: '2026-10-29T22:10:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

