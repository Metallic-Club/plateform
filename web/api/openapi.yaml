      description: |
        `available` can be spent now. `giftable` is the part of `available` that can also be gifted (purchased credits
        become giftable 72 hours after purchase). `pending` is creator earnings in escrow (7 days for game sales,
        30 days for marketplace sales). A chargeback on spent credits can make `available` negative; spending then
        pauses until it is positive again.
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
              example:
                balances:
                  - { currency: credits, available: 420, giftable: 300, pending: 80 }
                updatedAt: '2026-10-30T05:59:58Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

