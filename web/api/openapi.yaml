                    itemId: null
                    counterparty: null
                    createdAt: '2026-10-29T19:00:00Z'
                nextCursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: metallic_session
      description: Website session. HttpOnly, Secure, SameSite=Lax. Unsafe methods also need `X-CSRF-Token`.
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from `/v1/oauth/token` (15 minutes). Native apps only.

  headers:
    SetSessionCookie:
      description: '`metallic_session=<opaque>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000`'
      schema: { type: string }

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from a previous `nextCursor`.
      schema: { type: string, maxLength: 512 }
    Device:
      name: device
      in: query
      description: Layout hint so rows hold games that run on the viewer's device.
      schema: { type: string, enum: [desktop, mobile, console], default: desktop }

  responses:
    BadRequest:
      description: The request is malformed or a field failed validation. `errors` lists the fields.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.metallic.example/errors/validation
            title: Some fields are not valid
            status: 400
            code: validation_failed
            errors:
              - { field: username, code: too_short, message: Use 3 to 20 characters. }
    Unauthorized:
      description: Not signed in, or the token expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.metallic.example/errors/unauthorized
            title: Sign in needed
            status: 401
            code: unauthorized
    Forbidden:
      description: Signed in but not allowed (privacy, age band, account state).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.metallic.example/errors/forbidden
            title: Not allowed
            status: 403
            code: privacy_restricted
    NotFound:
      description: No such resource, or the viewer may not know it exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.metallic.example/errors/not-found
            title: Not found
            status: 404
            code: not_found
    TooManyRequests:
      description: Rate limited. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.metallic.example/errors/rate-limited
            title: Slow down
            status: 429
            code: rate_limited
    OAuthBadRequest:
      description: OAuth error (RFC 6749 section 5.2, RFC 8628 section 3.5).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OAuthError' }
          examples:
            pending: { value: { error: authorization_pending } }
            slowDown: { value: { error: slow_down } }
            denied: { value: { error: access_denied } }
            expired: { value: { error: expired_token } }

  schemas:
    Id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: 64-bit id as a decimal string.
      examples: ['1050000000000001']
    Username:
      type: string
      pattern: '^[A-Za-z0-9](?:[A-Za-z0-9_]{1,18}[A-Za-z0-9])$'
      minLength: 3
      maxLength: 20
      description: 3 to 20 characters; letters, digits and one underscore at a time, not at either end. Case-insensitive unique.
      examples: [ferro_kit]
    DisplayName:
      type: string
      minLength: 1
      maxLength: 32
    ClientId:
      type: string
      enum: [metallic-launcher, metallic-player, metallic-studio]
    GenreId:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,31}$'
      examples: [obby]
    RegionCode:
      type: string
      pattern: '^[a-z]{2,8}-[a-z]{2,12}$'
      examples: [us-east]
    Timestamp:
      type: string
      format: date-time
    NextCursor:
      type: [string, 'null']
      description: Pass as `cursor` to get the next page; null when there are no more.

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code; clients switch on this, never on `title`.
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope, authorization_pending, slow_down, access_denied, expired_token]
        error_description: { type: string }
    Health:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down, skipped] }

    # ---- auth
    SignUpRequest:
      type: object
      required: [username, password, email, birthDate, acceptTerms]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: Checked against a breached-password list. No other composition rules.
        email: { type: string, format: email, maxLength: 254 }
        birthDate:
          type: string
          format: date
          description: Used only to set `ageBand`; never shown to anyone.
        parentEmail:
          type: string
          format: email
          description: Required when the birth date makes the user younger than the digital-consent age where they live.
        acceptTerms: { type: boolean, const: true }
        captchaToken: { type: string }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: Username or email., maxLength: 254 }
        password: { type: string, maxLength: 128 }
        totpCode: { type: string, pattern: '^[0-9]{6}$' }
        captchaToken: { type: string }
    Session:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        csrfToken: { type: string }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
      examples:
        - user: { id: '1050000000000001', username: ferro_kit, displayName: Kit, avatarHeadshotUrl: https://cdn.metallic.example/h/4f1a9c.webp }
          csrfToken: c5r_Zp0q81
          expiresAt: '2026-11-29T06:00:00Z'
    UsernameCheck:
      type: object
      required: [username, available, reason]
      properties:
        username: { type: string }
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [taken, reserved, released_recently, not_allowed, invalid, null]
          description: |
            `reserved`: held for a known creator, brand or Metallic. `released_recently`: freed by a rename or
            deletion and held for 90 days. `not_allowed`: fails the name filter.
    WebSessionCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, pattern: '^wsc_[A-Za-z0-9_-]+$' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
      examples:
        - code: wsc_4f1a9cE7bQ2kLm0X
          expiresAt: '2026-10-30T18:01:00Z'
    WebSessionRedeemRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 128 }
    DeviceCodeRequest:
      type: object
      required: [client_id]
      properties:
        client_id: { $ref: '#/components/schemas/ClientId' }
        scope:
          type: string
          description: Space-separated scopes from `profile`, `play`, `publish`.
    DeviceCodeResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code: { type: string }
        user_code: { type: string, pattern: '^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$' }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer }
        interval: { type: integer }
    DeviceApproval:
      type: object
      required: [userCode, approve]
      properties:
        userCode: { type: string }
        approve: { type: boolean }
    DeviceApprovalResult:
      type: object
      required: [clientId, clientName, scopes, approved]
      properties:
        clientId: { $ref: '#/components/schemas/ClientId' }
        clientName: { type: string }
        scopes:
          type: array
          items: { type: string }
        approved: { type: boolean }
    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          enum: ['urn:ietf:params:oauth:grant-type:device_code', authorization_code, refresh_token]
        client_id: { $ref: '#/components/schemas/ClientId' }
        device_code: { type: string }
        code: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        redirect_uri:
          type: string
          description: Loopback only, `http://127.0.0.1:<port>/callback`.
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        refresh_token: { type: string }
        scope: { type: string }

    # ---- users
    UserSummary:
      type: object
      required: [id, username, displayName, avatarHeadshotUrl]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        avatarHeadshotUrl: { type: [string, 'null'], format: uri }
    UserSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    SocialPlatform:
      type: string
      enum: [discord, youtube, twitch, tiktok, x, bluesky, instagram, github]
    SocialLinkInput:
      type: object
      required: [platform, handle]
      properties:
        platform: { $ref: '#/components/schemas/SocialPlatform' }
        handle: { type: string, minLength: 1, maxLength: 64 }
    SocialLink:
      type: object
      required: [platform, handle, url, verified]
      properties:
        platform: { $ref: '#/components/schemas/SocialPlatform' }
        handle: { type: string }
        url:
          type: [string, 'null']
          format: uri
          description: Built by the server from the handle; null where the platform has no public profile URL (Discord).
        verified:
          type: boolean
          description: True when linked through that platform's sign-in, not typed in.
    Relationship:
      type: string
      enum: [self, friend, request_sent, request_received, blocked, none]
    UserProfile:
      type: object
      required: [id, username, displayName, avatarHeadshotUrl, createdAt, friendCount, isFirstParty, socialLinks]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        bio: { type: string, maxLength: 1000 }
        avatarHeadshotUrl: { type: [string, 'null'], format: uri }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        friendCount: { type: integer, minimum: 0 }
        isFirstParty:
          type: boolean
          description: Account belongs to the Metallic team.
        socialLinks:
          type: array
          items: { $ref: '#/components/schemas/SocialLink' }
        relationship: { $ref: '#/components/schemas/Relationship' }
        presence: { $ref: '#/components/schemas/Presence' }
    AgeBand:
      type: string
      enum: [under_13, '13_15', '16_17', adult, unknown]
      description: |
        From the self-declared birth date until age assurance runs; `unknown` for accounts created before age bands.
        Visible only to the account itself.
    Me:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required: [emailMasked, verification, ageBand, accountStatus, settings]
          properties:
            emailMasked: { type: string }
            verification:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [unverified, verified] }
                deleteAfter:
                  type: [string, 'null']
                  format: date-time
                  description: When an unverified account will be deleted. Null once verified.
            ageBand: { $ref: '#/components/schemas/AgeBand' }
            accountStatus:
              type: string
              enum: [active, limited, suspended]
              description: '`limited`: under-13 account awaiting parental consent.'
            settings: { $ref: '#/components/schemas/Settings' }
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        displayName: { $ref: '#/components/schemas/DisplayName' }
        bio: { type: string, maxLength: 1000 }
    Audience:
      type: string
      enum: [everyone, friends, nobody]
    Theme:
      type: string
      enum: [system, graphite, titanium, light]
      description: '`graphite` is the default dark theme, `titanium` a lighter dark, `light` the light theme.'
    Settings:
      type: object
      required: [theme, language, privacy]
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        language: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', examples: [en] }
        privacy:
          type: object
          required: [presenceVisibility, joinPolicy, friendRequests, socialLinksVisibility]
          properties:
            presenceVisibility: { $ref: '#/components/schemas/Audience' }
            joinPolicy: { $ref: '#/components/schemas/Audience' }
            friendRequests:
              type: string
              enum: [everyone, friends_of_friends, nobody]
            socialLinksVisibility: { $ref: '#/components/schemas/Audience' }
    SettingsUpdate:
      type: object
      minProperties: 1
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        language: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        privacy:
          type: object
          minProperties: 1
          properties:
            presenceVisibility: { $ref: '#/components/schemas/Audience' }
            joinPolicy: { $ref: '#/components/schemas/Audience' }
            friendRequests:
              type: string
              enum: [everyone, friends_of_friends, nobody]
            socialLinksVisibility: { $ref: '#/components/schemas/Audience' }

    # ---- friends
    Presence:
      type: object
      required: [userId, status, game, joinable, lastOnlineAt]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [offline, online, in_game, in_studio] }
        game:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
        joinable:
          type: boolean
          description: The viewer may follow this user into their server.
        lastOnlineAt:
          type: [string, 'null']
          format: date-time
    Friend:
      type: object
      required: [user, since]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        since: { $ref: '#/components/schemas/Timestamp' }
        presence: { $ref: '#/components/schemas/Presence' }
    FriendPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Friend' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    FriendRequest:
      type: object
      required: [id, user, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        user:
          $ref: '#/components/schemas/UserSummary'
          description: The other person (sender for incoming, recipient for outgoing).
        mutualFriends: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    FriendRequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FriendRequest' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    FriendRequestResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, friends] }
        requestId: { $ref: '#/components/schemas/Id' }

    # ---- games
    CreatorRef:
      type: object
      required: [type, id, name, isFirstParty]
      properties:
        type: { type: string, enum: [user, group] }
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        isFirstParty: { type: boolean }
    ContentLabel:
      type: string
      enum: [everyone, mild, moderate, restricted]
      description: |
        Set by the creator's content questionnaire and checked by moderation. `restricted` is 18+ and age-assured
        only (not in P1).
    RatingSummary:
      type: object
      required: [upPercent, votes]
      properties:
        upPercent: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Null under 20 votes. }
        votes: { type: integer, minimum: 0 }
    GameSummary:
      type: object
      required: [id, name, creator, iconUrl, thumbnailUrl, genres, playing, rating, contentLabel, isFirstParty]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 50 }
        creator: { $ref: '#/components/schemas/CreatorRef' }
        iconUrl: { type: string, format: uri }
        thumbnailUrl: { type: string, format: uri }
        genres:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/GenreId' }
        playing: { type: integer, minimum: 0 }
        rating: { $ref: '#/components/schemas/RatingSummary' }
        contentLabel: { $ref: '#/components/schemas/ContentLabel' }
        isFirstParty: { type: boolean }
    GameSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GameSummary' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    GameDetail:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required: [description, screenshots, startPlaceId, maxPlayersPerServer, platforms, visits, favorites, createdAt, updatedAt, friendsPlaying]
          properties:
            description: { type: string, maxLength: 4000 }
            screenshots:
              type: array
              maxItems: 10
              items: { type: string, format: uri }
            startPlaceId: { $ref: '#/components/schemas/Id' }
            maxPlayersPerServer: { type: integer, minimum: 1, maximum: 200 }
            platforms:
              type: array
              items: { type: string, enum: [windows, macos, linux, android, ios] }
            visits: { type: integer, minimum: 0 }
            favorites: { type: integer, minimum: 0 }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            updatedAt: { $ref: '#/components/schemas/Timestamp' }
            friendsPlaying:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/UserSummary' }
            viewer:
              type: object
              required: [isFavorite, vote, canVote, lastPlayedAt]
              properties:
                isFavorite: { type: boolean }
                vote: { type: [string, 'null'], enum: [up, down, null] }
                canVote: { type: boolean }
                lastPlayedAt: { type: [string, 'null'], format: date-time }
    Genre:
      type: object
      required: [id, name, description, gameCount]
      properties:
        id: { $ref: '#/components/schemas/GenreId' }
        name: { type: string }
        description: { type: string }
        gameCount: { type: integer, minimum: 0 }
    HomeSection:
      type: object
      required: [id, kind, title, reason, items]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [featured, continue, friends_playing, recommended, because_you_played, first_party, popular, trending, new_and_rising]
        title: { type: string }
        reason:
          type: string
          description: One line shown under the row title, e.g. "Because you played Parkour".
        items:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/GameSummary' }
    HomeFeed:
      type: object
      required: [generatedAt, sections]
      properties:
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/HomeSection' }
    Rating:
      type: object
      required: [gameId, up, down, upPercent]
      properties:
        gameId: { $ref: '#/components/schemas/Id' }
        up: { type: integer, minimum: 0 }
        down: { type: integer, minimum: 0 }
        upPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        myVote: { type: [string, 'null'], enum: [up, down, null] }
        canVote: { type: boolean }
        cannotVoteReason:
          type: [string, 'null']
          enum: [play_longer, verify_email, account_too_new, restricted, null]
    LiveCount:
      type: object
      required: [gameId, playing, servers, updatedAt]
      properties:
        gameId: { $ref: '#/components/schemas/Id' }
        playing: { type: integer, minimum: 0 }
        servers: { type: integer, minimum: 0 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    PlatformLive:
      type: object
      required: [playing, online, servers, updatedAt]
      properties:
        playing: { type: integer, minimum: 0, description: Users in a game server. }
        online: { type: integer, minimum: 0, description: Users with any client open. }
        servers: { type: integer, minimum: 0 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    # ---- servers
    Region:
      type: object
      required: [code, name, probeUrl]
      properties:
        code: { $ref: '#/components/schemas/RegionCode' }
        name: { type: string }
        probeUrl: { type: string, format: uri }
    Server:
      type: object
      required: [id, gameId, placeId, region, playing, maxPlayers, friends, startedAt, joinable]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        gameId: { $ref: '#/components/schemas/Id' }
        placeId: { $ref: '#/components/schemas/Id' }
        region: { $ref: '#/components/schemas/RegionCode' }
        playing: { type: integer, minimum: 0 }
        maxPlayers: { type: integer, minimum: 1 }
        friends:
          type: array
          description: Viewer's friends in this server whose presence is visible to the viewer.
          items: { $ref: '#/components/schemas/UserSummary' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        joinable: { type: boolean, description: False when full or draining. }
    ServerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Server' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    JoinRequest:
      type: object
      properties:
        serverId: { $ref: '#/components/schemas/Id' }
        followUserId: { $ref: '#/components/schemas/Id' }
        region: { $ref: '#/components/schemas/RegionCode' }
      not:
        required: [serverId, followUserId]
    JoinTicket:
      type: object
      required: [ticket, launchUri, placeId, expiresAt]
      properties:
        ticket: { type: string }
        launchUri:
          type: string
          pattern: '^metallic://play\?'
        placeId: { $ref: '#/components/schemas/Id' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }

    # ---- library
    Favorite:
      type: object
      required: [game, favoritedAt]
      properties:
        game: { $ref: '#/components/schemas/GameSummary' }
        favoritedAt: { $ref: '#/components/schemas/Timestamp' }
    FavoritePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Favorite' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    PlayHistoryEntry:
      type: object
      required: [game, lastPlayedAt, minutesPlayed]
      properties:
        game: { $ref: '#/components/schemas/GameSummary' }
        lastPlayedAt: { $ref: '#/components/schemas/Timestamp' }
        minutesPlayed:
          type: integer
          minimum: 0
          description: Total over all sessions, rounded down.
    PlayHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlayHistoryEntry' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }

    # ---- catalog
    ItemCategory:
      type: string
      enum: [hat, hair, face, face_accessory, neck, shoulder, back, waist, shirt, pants, shoes, body, emote, bundle]
    Price:
      type: object
      required: [currency, amount]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        amount: { type: integer, minimum: 0 }
    CatalogItemSummary:
      type: object
      required: [id, name, category, creator, thumbnailUrl, price, onSale, limited]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 50 }
        category: { $ref: '#/components/schemas/ItemCategory' }
        creator: { $ref: '#/components/schemas/CreatorRef' }
        thumbnailUrl: { type: string, format: uri }
        price:
          oneOf:
            - $ref: '#/components/schemas/Price'
            - type: 'null'
          description: Null when not for sale.
        onSale: { type: boolean }
        limited:
          type: [object, 'null']
          description: Present for limited-quantity items (resale arrives with trading, not in P1).
          required: [totalSupply, remaining]
          properties:
            totalSupply: { type: integer, minimum: 1 }
            remaining: { type: integer, minimum: 0 }
    CatalogItem:
      allOf:
        - $ref: '#/components/schemas/CatalogItemSummary'
        - type: object
          required: [description, createdAt]
          properties:
            description: { type: string, maxLength: 1000 }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            owned: { type: boolean }
    CatalogItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogItemSummary' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    InventoryItem:
      type: object
      required: [item, acquiredAt, source]
      properties:
        item: { $ref: '#/components/schemas/CatalogItemSummary' }
        acquiredAt: { $ref: '#/components/schemas/Timestamp' }
        source: { type: string, enum: [starter, purchase, gift, reward, promotion] }
        serial:
          type: [integer, 'null']
          description: Copy number for limited items.
    InventoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryItem' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
    BodyColors:
      type: object
      required: [head, torso, arms, legs]
      properties:
        head: { $ref: '#/components/schemas/HexColor' }
        torso: { $ref: '#/components/schemas/HexColor' }
        arms: { $ref: '#/components/schemas/HexColor' }
        legs: { $ref: '#/components/schemas/HexColor' }
    Avatar:
      type: object
      required: [userId, bodyColors, equipped, headshotUrl, fullBodyUrl, updatedAt]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        bodyColors: { $ref: '#/components/schemas/BodyColors' }
        equipped:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CatalogItemSummary' }
        headshotUrl: { type: [string, 'null'], format: uri }
        fullBodyUrl: { type: [string, 'null'], format: uri }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AvatarUpdate:
      type: object
      required: [bodyColors, equippedItemIds]
      properties:
        bodyColors: { $ref: '#/components/schemas/BodyColors' }
        equippedItemIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }

    # ---- economy
    Currency:
      type: string
      enum: [credits]
      description: The one platform currency. "credits" is a working name until the owner picks one.
    Balance:
      type: object
      required: [currency, available, giftable, pending]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        available:
          type: integer
          description: Spendable now. Negative only after a chargeback on credits already spent.
        giftable: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
    Wallet:
      type: object
      required: [balances, updatedAt]
      properties:
        balances:
          type: array
          items: { $ref: '#/components/schemas/Balance' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    TransactionType:
      type: string
      enum: [purchase, reward, item_purchase, item_sale, gift_sent, gift_received, game_purchase, game_earning, refund, reversal, adjustment]
    Transaction:
      type: object
      required: [id, type, currency, amount, status, description, itemId, counterparty, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/TransactionType' }
        currency: { $ref: '#/components/schemas/Currency' }
        amount:
          type: integer
          description: Signed change to the user's balance.
        status: { type: string, enum: [pending, settled, reversed] }
        description: { type: string }
        itemId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        counterparty:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
