openapi: 3.1.0
info:
  title: Metallic Platform API
  version: 0.1.1
  summary: Public HTTP API for the Metallic website, Launcher, Player and Studio (milestone P1).
  description: |
    The platform API behind the Metallic website, the desktop Launcher, the Metallic player and Metallic Studio.
    Design: `docs/superpowers/specs/2026-10-30-platform-design.md`. This file is the source of truth: the server
    implements it and the web app generates its types from it.

    Conventions
    - All paths start with `/v1`. Breaking changes get `/v2`; additive changes keep `/v1`.
    - IDs are 64-bit integers sent as decimal strings (JavaScript cannot hold them as numbers).
    - Times are RFC 3339 in UTC.
    - Lists use cursor pagination: `?limit=&cursor=`; the response has `items` and `nextCursor` (null at the end).
    - Errors use RFC 9457 problem details (`application/problem+json`) with a stable `code`.
    - Browser clients use the `metallic_session` cookie and must send `X-CSRF-Token` on POST, PUT, PATCH and DELETE.
      Native clients (Launcher, Player, Studio) use a bearer access token from the device or PKCE flow and send no
      cookie. Native clients never see a password.
    - Rate limits are reported with `RateLimit-Policy` and `RateLimit` headers; a 429 carries `Retry-After`.
  license:
    name: Proprietary
    identifier: LicenseRef-Metallic-Proprietary
servers:
  - url: /
    description: Same origin as the website. Deployed hosts are configured per environment, never in this file.
tags:
  - name: ops
    description: Health checks for load balancers.
  - name: auth
    description: Sign-up, sign-in, sessions, and the device and PKCE flows for native apps.
  - name: users
    description: Profiles, settings and social links.
  - name: friends
    description: Friends, friend requests, blocks and presence.
  - name: games
    description: Game list, detail, search, home feed, ratings and live counts.
  - name: servers
    description: Running servers of a game and join tickets for the Player.
  - name: library
    description: The signed-in user's favourites and play history.
  - name: catalog
    description: Avatar items, inventory and the worn avatar (read in P1, plus equip).
  - name: economy
    description: Currency balance and transaction history (read only in P1).

security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  /v1/readyz:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Readiness (internal only)
      description: >-
        Readiness for load balancers and monitoring, with database and cache checks.
        Internal only: the gateway never exposes it on the public origin. Public
        `/healthz` on the site's origin is the website's cheap liveness check, which
        the desktop Launcher calls before showing the site (plateform #7).
      security: []
      responses:
        '200':
          description: The service is up. `checks` lists dependencies and their state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: ok
                version: 0.1.0
                checks: { database: ok, cache: ok }
        '503':
          description: A required dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: degraded
                version: 0.1.0
                checks: { database: down, cache: ok }

  # ---------------------------------------------------------------- auth
  /v1/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account
      description: |
        Creates an account and a browser session. The account starts `unverified`; the user must verify the email
        address within 30 days or the account is deleted (see `Me.verification`). Under-13 sign-ups need
        `parentEmail`; the account stays limited until a parent confirms.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
            example:
              username: ferro_kit
              password: correct-horse-battery-staple
              email: kit@example.com
              birthDate: '2010-04-17'
              acceptTerms: true
              captchaToken: 03AFcWeA...
      responses:
        '201':
          description: Account created and signed in. Sets the `metallic_session` cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Username or email not available.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://docs.metallic.example/errors/username-unavailable
                title: Username not available
                status: 409
                code: username_unavailable
                detail: That name is reserved.
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/username-check:
    get:
      tags: [auth]
      operationId: checkUsername
      summary: Check whether a username can be taken
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Username' }
      responses:
        '200':
          description: Availability and, when unavailable, why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsernameCheck' }
              examples:
                available:
                  value: { username: ferro_kit, available: true, reason: null }
                cooldown:
                  value: { username: chrome, available: false, reason: released_recently }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Sign in on the website
      description: Browser-only. Returns `mfa_required` when the account has a second factor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { login: ferro_kit, password: correct-horse-battery-staple }
      responses:
        '200':
          description: Signed in. Sets the `metallic_session` cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Wrong login or password. The response never says which.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://docs.metallic.example/errors/invalid-credentials
                title: Sign-in failed
                status: 401
                code: invalid_credentials
        '403':
          description: Second factor needed, or the account is banned.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                mfa:
                  value:
                    type: https://docs.metallic.example/errors/mfa-required
                    title: Second step needed
                    status: 403
                    code: mfa_required
                banned:
                  value:
                    type: https://docs.metallic.example/errors/account-banned
                    title: Account banned
                    status: 403
                    code: account_banned
                    detail: See the moderation notice for the reason and how to appeal.
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: End the current session
      responses:
        '204': { description: Signed out; the cookie is cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session
      responses:
        '200':
          description: The signed-in user and a fresh CSRF token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address with the code from the email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 16, maxLength: 128 }
            example: { token: 7hQm2c9RkPz0vXwY4bLs }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: The link expired or was already used.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: Send the verification email again
      responses:
        '204': { description: 'Sent, or skipped if already verified.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/oauth/device/code:
    post:
      tags: [auth]
      operationId: startDeviceAuthorization
      summary: Start device sign-in (RFC 8628) from the Launcher, Player or Studio
      description: |
        The app shows `user_code` and opens `verification_uri_complete` in the browser. The user signs in on the
        website and approves. The app polls `/v1/oauth/token` every `interval` seconds.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DeviceCodeRequest' }
            example: { client_id: metallic-studio, scope: 'profile play publish' }
      responses:
        '200':
          description: Codes issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCodeResponse' }
              example:
                device_code: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
                user_code: WDJB-MJHT
                verification_uri: https://metallic.example/activate
                verification_uri_complete: https://metallic.example/activate?code=WDJB-MJHT
                expires_in: 600
                interval: 5
        '400': { $ref: '#/components/responses/OAuthBadRequest' }

  /v1/oauth/device/approve:
    post:
      tags: [auth]
      operationId: approveDeviceAuthorization
      summary: Approve or deny a device sign-in (website, signed in)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceApproval' }
            example: { userCode: WDJB-MJHT, approve: true }
      responses:
        '200':
          description: Which app asked and what it was granted, for the confirmation screen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceApprovalResult' }
              example:
                clientId: metallic-studio
                clientName: Metallic Studio
                scopes: [profile, play, publish]
                approved: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/oauth/token:
    post:
      tags: [auth]
      operationId: exchangeToken
      summary: Token endpoint for native apps
      description: |
        Grants: `urn:ietf:params:oauth:grant-type:device_code` (RFC 8628), `authorization_code` with PKCE
        (RFC 7636, loopback redirect per RFC 8252) and `refresh_token`. Refresh tokens rotate on every use; reusing an
        old one revokes the whole chain.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              device:
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:device_code
                  device_code: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
                  client_id: metallic-studio
              refresh:
                value:
                  grant_type: refresh_token
                  refresh_token: mrt_8xLq0aPz
                  client_id: metallic-launcher
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example:
                access_token: mat_eyJraWQiOiJ0ZXN0In0
                token_type: Bearer
                expires_in: 900
                refresh_token: mrt_9yMr1bQa
                scope: profile play publish
        '400': { $ref: '#/components/responses/OAuthBadRequest' }

  /v1/oauth/revoke:
    post:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke a refresh or access token (RFC 7009)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
                client_id: { $ref: '#/components/schemas/ClientId' }
      responses:
        '200': { description: 'Revoked, or the token was already invalid.' }
        '400': { $ref: '#/components/responses/OAuthBadRequest' }

  /v1/oauth/web-session:
    post:
      tags: [auth]
      operationId: createWebSessionCode
      summary: One-time code that signs the website in as this app's user (Launcher web view)
      description: |
        A first-party app (bearer token with the `profile` scope) asks for a code, then opens
        `/auth/launcher-handoff?code=...` on the website, which redeems it server-side. The code is single use,
        lives 60 seconds and is stored only as a hash. Browser sessions cannot ask for one.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Code issued.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSessionCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/oauth/web-session/redeem:
    post:
      tags: [auth]
      operationId: redeemWebSessionCode
      summary: Trade a web-session code for a website session (called by the website's server)
      description: |
        Answers like `logIn`: the session and `Set-Cookie`. A wrong, used or expired code is always the same 400
        (`invalid_code`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebSessionRedeemRequest' }
            example: { code: wsc_4f1a9cE7bQ2kLm0X }
      responses:
        '200':
          description: Signed in. Sets the `metallic_session` cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: The code is wrong, used or expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://docs.metallic.example/errors/invalid-code
                title: This sign-in link has expired
                status: 400
                code: invalid_code
                detail: Sign in again from the Metallic app.
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- users
  /v1/users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: The signed-in user's own account
      responses:
        '200':
          description: Own profile plus private fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: '1050000000000001'
                username: ferro_kit
                displayName: Kit
                bio: I build obbies.
                avatarHeadshotUrl: https://cdn.metallic.example/h/4f1a9c.webp
                createdAt: '2026-10-01T18:22:04Z'
                socialLinks: []
                friendCount: 12
                isFirstParty: false
                emailMasked: k***@example.com
                verification: { status: unverified, deleteAfter: '2026-10-31T18:22:04Z' }
                ageBand: '13_15'
                accountStatus: active
                settings:
                  theme: graphite
                  language: en
                  privacy:
                    presenceVisibility: friends
                    joinPolicy: friends
                    friendRequests: everyone
                    socialLinksVisibility: friends
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      operationId: updateMe
      summary: Edit display name and bio
      description: Text passes the chat filter. Display names can change once every 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
            example: { bio: Parkour maps and speedruns. }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/users/me/settings:
    get:
      tags: [users]
      operationId: getSettings
      summary: Theme, language and privacy settings
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      operationId: updateSettings
      summary: Change settings
      description: For under-13 accounts the server caps privacy fields at the parent-set level.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
            example: { theme: titanium, privacy: { joinPolicy: nobody } }
      responses:
        '200':
          description: Settings after the change (capped values show what was applied).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/users/me/social-links:
    put:
      tags: [users]
      operationId: replaceSocialLinks
      summary: Set the profile's social links
      description: |
        Plain handles in P1; the server builds the URL. Discord links made through Discord account linking show
        `verified: true` (P2). Accounts under 16 get 403 `age_restricted`; from P2 links show to others only after
        the owner passes age assurance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  maxItems: 8
                  items: { $ref: '#/components/schemas/SocialLinkInput' }
            example:
              links:
                - { platform: youtube, handle: '@ferrokit' }
                - { platform: twitch, handle: ferrokit }
      responses:
        '200':
          description: Links as stored.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocialLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/users/{userId}:
    get:
      tags: [users]
      operationId: getUser
      summary: Public profile
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Profile as the viewer may see it (fields hidden by privacy are absent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
              example:
                id: '1050000000000002'
                username: argent
                displayName: Argent
                bio: Racing games.
                avatarHeadshotUrl: https://cdn.metallic.example/h/88b20e.webp
                createdAt: '2026-09-12T09:00:00Z'
                friendCount: 40
                isFirstParty: false
                socialLinks:
                  - { platform: discord, handle: argent, url: null, verified: true }
                relationship: friend
                presence: { userId: '1050000000000002', status: in_game, game: { id: '2050000000000010', name: Parkour }, joinable: true, lastOnlineAt: null }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/usernames/{username}:
    get:
      tags: [users]
      operationId: getUserByUsername
      summary: Look up a user by username
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Username' }
      responses:
        '200':
          description: Same as `getUser`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users/search:
    get:
      tags: [users]
      operationId: searchUsers
      summary: Find people by username or display name
      description: Under-13 accounts do not appear in search for users they are not friends with.
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 32 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matches, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- friends
  /v1/users/{userId}/friends:
    get:
      tags: [friends]
      operationId: listFriends
      summary: A user's friends
      description: Own list always; another user's list only if their privacy allows the viewer.
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Friends, most recently active first for the owner, alphabetical for others.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/friends/requests:
    get:
      tags: [friends]
      operationId: listFriendRequests
      summary: Incoming or outgoing friend requests
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pending requests, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [friends]
      operationId: sendFriendRequest
      summary: Ask someone to be friends
      description: |
        Fails with `friend_limit_reached` at 500 friends, `requests_not_allowed` when the target's privacy forbids it,
        and silently succeeds (but sends nothing) when the target has blocked the sender. If the target already sent
        a request to the caller, both become friends at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/Id' }
            example: { userId: '1050000000000002' }
      responses:
        '201':
          description: Request sent, or friendship made (see `status`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequestResult' }
              example: { status: pending, requestId: '3050000000000044' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/friends/requests/{requestId}/accept:
    post:
      tags: [friends]
      operationId: acceptFriendRequest
      summary: Accept an incoming request
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Now friends.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Friend' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/friends/requests/{requestId}:
    delete:
      tags: [friends]
      operationId: deleteFriendRequest
      summary: Decline an incoming request or cancel an outgoing one
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Removed. The sender is not told it was declined. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/friends/{userId}:
    delete:
      tags: [friends]
      operationId: removeFriend
      summary: Unfriend
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: No longer friends. }
