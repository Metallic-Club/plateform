          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformLive' }
              example: { playing: 5210, online: 7988, servers: 301, updatedAt: '2026-10-30T06:00:12Z' }

  # ---------------------------------------------------------------- servers
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/regions:
    get:
      tags: [servers]
      operationId: listRegions
      summary: Server regions and their latency probe endpoints
      description: The Player pings each `probeUrl` (HTTPS, tiny response) to pick a region and show ping.
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Regions with capacity.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Region' }
              example:
                items:
                  - { code: us-east, name: US East, probeUrl: https://probe-us-east.metallic.example/ping }
                  - { code: eu-central, name: Europe, probeUrl: https://probe-eu-central.metallic.example/ping }

        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/games/{gameId}/servers:
    get:
      tags: [servers]
      operationId: listServers
      summary: Public servers of a game (server browser)
      description: |
        Servers with friends of the viewer come first, then by the chosen sort. Private and reserved servers are not
        listed. Never exposes server addresses: joining goes through a ticket.
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionCode' }
        - name: sort
          in: query
          schema: { type: string, enum: [most_players, fewest_players, newest], default: most_players }
        - name: hideFull
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of servers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerPage' }
              example:
                items:
                  - id: '4050000000000301'
                    gameId: '2050000000000010'
                    placeId: '2150000000000010'
                    region: us-east
                    playing: 18
                    maxPlayers: 24
                    friends:
                      - { id: '1050000000000002', username: argent, displayName: Argent, avatarHeadshotUrl: https://cdn.metallic.example/h/88b20e.webp }
                    startedAt: '2026-10-30T05:12:00Z'
                    joinable: true
                nextCursor: eyJvIjoyMH0
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/games/{gameId}/join:
    post:
      tags: [servers]
      operationId: createJoinTicket
      summary: Get a join ticket and the `metallic://` link that starts the Player
      description: |
        With no body fields the matchmaker picks a server (best region, friends, fill). `serverId` joins a listed
        server; `followUserId` joins a friend if their `joinPolicy` allows it. The ticket is single-use and lives 60
        seconds. Inside the Launcher the web app opens `launchUri` directly; in a browser it opens the same link,
        which the installed Launcher handles.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequest' }
            examples:
              quick: { value: {} }
              friend: { value: { followUserId: '1050000000000002' } }
      responses:
        '201':
          description: Ticket issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinTicket' }
              example:
                ticket: jt_q3Vn0w9LkS2c
                launchUri: metallic://play?place=2150000000000010&ticket=jt_q3Vn0w9LkS2c
                placeId: '2150000000000010'
                expiresAt: '2026-10-30T06:01:12Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The chosen server is full or closing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://docs.metallic.example/errors/server-full
                title: Server full
                status: 409
                code: server_full

