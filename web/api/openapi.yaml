  /v1/games/{gameId}/rating:
    get:
      tags: [games]
      operationId: getRating
      summary: Rating totals and the viewer's vote
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Totals; `myVote` and `canVote` only when signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
              example: { gameId: '2050000000000010', up: 4710, down: 410, upPercent: 92, myVote: null, canVote: false, cannotVoteReason: play_longer }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [games]
      operationId: setRating
      summary: Vote up or down
      description: Allowed after 10 minutes of total play in this game on an email-verified account at least 3 days old.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vote]
              properties:
                vote: { type: string, enum: [up, down] }
            example: { vote: up }
      responses:
        '200':
          description: Totals after the vote (eventually consistent; may lag a few seconds).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [games]
      operationId: clearRating
