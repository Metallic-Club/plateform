  /v1/games/live:
    get:
      tags: [games]
      operationId: getLiveCounts
      summary: Live player and server counts for up to 100 games
      description: Counts come from server heartbeats and are at most 30 seconds old. Cache for 15 seconds.
      security: [{}, { sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: gameIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: One entry per id.
          headers:
            Cache-Control:
              schema: { type: string }
              example: public, max-age=15
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LiveCount' }
              example:
                items:
                  - { gameId: '2050000000000010', playing: 1840, servers: 82, updatedAt: '2026-10-30T06:00:12Z' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/stats/live:
    get:
